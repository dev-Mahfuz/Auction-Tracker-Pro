name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Verify build files
        shell: powershell
        run: |
          Write-Host "Repository files:"
          Get-ChildItem -Recurse assets

          if (-not (Test-Path "main.py")) {
            throw "main.py was not found"
          }

          if (-not (Test-Path "assets/app_icon.ico")) {
            throw "assets/app_icon.ico was not found"
          }

      - name: Build Windows executable
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "AuctionTrackerPro" `
            --icon "assets/app_icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Rename executable
        shell: powershell
        run: |
          Rename-Item `
            "dist/AuctionTrackerPro.exe" `
            "AuctionTrackerPro-Windows-x64.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AuctionTrackerPro-Windows-x64
          path: dist/AuctionTrackerPro-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
